<!DOCTYPE html>
<html lang="en-us">
<head>
  <base href="https://cdn.jsdelivr.net/gh/genizy/web-port@main/bendy/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bendy and the Ink Machine</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        #unityContainer { width: 100%; height: 100%; }
        #loading-text { color: white; font-size: 24px; font-family: cursive; text-align: center; margin-top: 20px; position: absolute; width: 100%; z-index: 10; }
    </style>
    <script src="Build/UnityLoader.js"></script>
    <script>
        function mergeFiles(fileParts) {
            return new Promise((resolve, reject) => {
                let buffers = [];
                function fetchPart(index) {
                    if (index >= fileParts.length) {
                        let mergedBlob = new Blob(buffers);
                        let mergedFileUrl = URL.createObjectURL(mergedBlob);
                        resolve(mergedFileUrl);
                        return;
                    }
                    fetch(fileParts[index]).then((response) => response.arrayBuffer()).then((data) => {
                        buffers.push(data);
                        fetchPart(index + 1);
                    }).catch(reject);
                }
                fetchPart(0);
            });
        }

        function getParts(file, start, end) {
            let parts = [];
            for (let i = start; i <= end; i++) parts.push(file + ".part" + i);
            return parts;
        }

        Promise.all([
            mergeFiles(getParts("Build/BATIM.data.unityweb", 1, 7))
        ]).then(([dataUrl]) => {
            var json = {
                "companyName": "TheMeatly",
                "productName": "Bendy",
                "dataUrl": dataUrl,
                "wasmCodeUrl": "Build/BATIM.wasm.code.unityweb",
                "wasmFrameworkUrl": "Build/BATIM.wasm.framework.unityweb",
                "graphicsAPI": ["WebGL 2.0", "WebGL 1.0"],
                "backgroundColor": "#231F20",
            };
            UnityLoader.instantiate("unityContainer", json, {
                Module: {
                    onRuntimeInitialized: function () {
                        document.querySelector("#loading-text").remove();
                    }
                }
            });
        });
    </script>
</head>
<body>
    <div id="loading-text">LOADING...</div>
    <div id="unityContainer"></div>
</body>
</html>
