<!DOCTYPE html>
<html lang="en-us">
<head>
    <base href="https://cdn.jsdelivr.net/gh/genizy/web-port@main/amanda-the-adventurer/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Amanda The Adventurer</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        #unity-container { width: 100%; height: 100%; }
        #unity-canvas { width: 100%; height: 100%; }
        #loading-text { color: white; font-size: 24px; font-family: cursive; text-align: center; margin-top: 20px; position: absolute; width: 100%; z-index: 10; }
    </style>
</head>
<body>
    <div id="loading-text">LOADING...</div>
    <div id="unity-container">
        <canvas id="unity-canvas"></canvas>
    </div>
    <script>
        var loadingText = document.querySelector("#loading-text");
        let doneparts = 0;
        let maxparts = 0;

        function mergeFiles(fileParts) {
            return Promise.all(fileParts.map(part => fetch(part).then(res => res.arrayBuffer()).then(buf => {
                doneparts++;
                loadingText.textContent = `LOADING... (${doneparts}/${maxparts})`;
                return buf;
            }))).then(buffers => {
                return URL.createObjectURL(new Blob(buffers));
            });
        }

        function getParts(file, start, end) {
            let parts = [];
            for (let i = start; i <= end; i++) parts.push(file + ".part" + i);
            maxparts += parts.length;
            return parts;
        }

        Promise.all([
            mergeFiles(getParts("Build/Build.wasm", 1, 4)),
            mergeFiles(getParts("Build/Build.data", 1, 63)),
        ]).then(([wasmUrl, dataUrl]) => {
            var canvas = document.querySelector("#unity-canvas");
            var buildUrl = "Build";
            var loaderUrl = buildUrl + "/Build.loader.js";
            var config = {
                dataUrl: dataUrl,
                frameworkUrl: buildUrl + "/Build.framework.js",
                codeUrl: wasmUrl,
                streamingAssetsUrl: "StreamingAssets",
                companyName: "MangledMaw",
                productName: "Amanda The Adventurer",
            };
            var script = document.createElement("script");
            script.src = loaderUrl;
            script.onload = () => {
                createUnityInstance(canvas, config, (progress) => {}).then(() => {
                    loadingText.remove();
                });
            };
            document.body.appendChild(script);
        });
    </script>
</body>
</html>
