<!DOCTYPE html>
<html lang="en-us">
  <head>
    <base href="https://cdn.jsdelivr.net/gh/web-ports/fnae@afd4e5071add297d6169665a4f999d62f312532e/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Five Night's at BIG E</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      body { margin: 0; padding: 0; background-color: #000; overflow: hidden; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      #unity-container { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
      #unity-canvas { width: 960px; height: 600px; max-width: 100%; max-height: 100%; object-fit: contain; }
    </style>
  </head>
  <body>
  <div id="loading-text"
    style="color: white; font-size: 32px; font-family: cursive; text-align: center; margin-top: 20px;"> LOADING...
  </div>
    <div id="unity-container">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar" style="display:none; position: absolute; bottom: 50px; width: 300px;">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty" style="width: 100%; background: #444; height: 10px; border-radius: 5px;">
          <div id="unity-progress-bar-full" style="width: 0%; background: #3b82f6; height: 100%; border-radius: 5px;"></div>
        </div>
      </div>
    </div>
    <script>
    var loadingText = document.querySelector("#loading-text");
    let totalBytes = 0;
    let loadedBytes = 0;

    async function fetchWithProgress(url) {
      const response = await fetch(url);
      const reader = response.body.getReader();
      let chunks = [];
      let received = 0;
      while (true) {
        const {
          done,
          value
        } = await reader.read();
        if (done) break;
        received += value.length;
        loadedBytes += value.length;
        chunks.push(value);
        let mbDone = (loadedBytes / (1024 * 1024)).toFixed(2);
        let mbTotal = '139.53';
        loadingText.textContent = `LOADING... ${mbDone} MB / ${mbTotal} MB`;
      }
      let fullBuffer = new Uint8Array(received);
      let offset = 0;
      for (let chunk of chunks) {
        fullBuffer.set(chunk, offset);
        offset += chunk.length;
      }
      return fullBuffer.buffer;
    }

    async function mergeFiles(fileParts, cacheKey) {
      const buffers = await Promise.all(
        fileParts.map(part => fetchWithProgress(part))
      );
      const mergedBlob = new Blob(buffers);
      return URL.createObjectURL(mergedBlob);
    }

    function getParts(file, start, end) {
      let parts = [];
      for (let i = start; i <= end; i++) {
        parts.push(file + ".part" + i);
      }
      return parts;
    }
    (async () => {
      try {
        const [dataUrl, wasmUrl, webm] = await Promise.all([
          mergeFiles(getParts("Build/fnae.data", 1, 3), "fnae.data"),
          mergeFiles(getParts("Build/fnae.wasm", 1, 2), "fnae.wasm"),
          mergeFiles(getParts("StreamingAssets/202512191935.webm", 1, 3), "202512191935.webm"),
        ]);

        window.randomwebm = webm;
        const realSrc = Object.getOwnPropertyDescriptor(
          HTMLMediaElement.prototype,
          "src"
        );

        Object.defineProperty(HTMLMediaElement.prototype, "src", {
          set(value) {
            if (typeof value === "string" && value.includes("202512191935.mp4")) {
              value = window.randomwebm;
            }
            return realSrc.set.call(this, value);
          },
          get() {
            return realSrc.get.call(this);
          }
        });


        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");

        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/fnae.loader.js";
        var config = {
          arguments: [],
          dataUrl: dataUrl,
          frameworkUrl: buildUrl + "/fnae.framework.js",
          codeUrl: wasmUrl,
          streamingAssetsUrl: "StreamingAssets",
          companyName: "DefaultCompany",
          productName: "fnae",
          productVersion: "1.0",
        };

        loadingBar.style.display = "block";

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
          createUnityInstance(canvas, config, (progress) => {
            progressBarFull.style.width = 100 * progress + "%";
          }).then((unityInstance) => {
            loadingBar.style.display = "none";
            loadingText.remove();
          }).catch((message) => {
            console.error(message);
          });
        };
        document.body.appendChild(script);
      } catch (err) {
        loadingText.textContent = "Error loading game: " + err.message;
        console.error(err);
      }
    })();
    </script>
  </body>
</html>
