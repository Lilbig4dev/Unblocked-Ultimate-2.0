<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Slope - Unity WebGL</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        .webgl-content { width: 100%; height: 100%; position: relative; }
        #gameContainer { width: 100% !important; height: 100% !important; }
        canvas { width: 100% !important; height: 100% !important; }
        #run_game {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 20px 40px; font-size: 24px; cursor: pointer; background: #2c2c2c; color: #fff;
            border: none; border-radius: 8px; z-index: 100; font-family: sans-serif;
        }
        #run_game:hover { background: #3f3f3f; }
    </style>
    <script src="https://cdn.jsdelivr.net/gh/spadezplz/Phantoms-Archive@b936818f6d1900a4bb6418b704a9051630d9a968/Slope/UnityProgress.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/spadezplz/Phantoms-Archive@b936818f6d1900a4bb6418b704a9051630d9a968/Slope/UnityLoader.js"></script>
</head>
<body>
    <div class="webgl-content">
        <div id="gameContainer"></div>
        <button id="run_game">CLICK TO PLAY NOW</button>
    </div>
    <script>
        var gameInstance;
        document.getElementById('run_game').onclick = function() {
            gameInstance = UnityLoader.instantiate("gameContainer", "https://cdn.jsdelivr.net/gh/spadezplz/Phantoms-Archive@b936818f6d1900a4bb6418b704a9051630d9a968/Slope/slope_new.json", {
                onProgress: UnityProgress,
                Module: { onRuntimeInitialized: function() { UnityProgress(gameInstance, "complete") } }
            });
            this.remove();
        }
    </script>
</body>
</html>
