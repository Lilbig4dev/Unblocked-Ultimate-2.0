<!DOCTYPE html>
<html lang="en-us">
	<head>
		<base href="https://cdn.jsdelivr.net/gh/genizy/web-port@main/fears-to-fathom/home-alone/">
		<meta charset="utf-8" />
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
		<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
		<title>Fears To Fathom: Home Alone</title>
		<style>
			body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
			#unityContainer { width: 100%; height: 100%; }
			#loading-text { color: white; font-size: 24px; font-family: cursive; text-align: center; margin-top: 20px; position: absolute; width: 100%; z-index: 10; }
		</style>
		<script src="Build/UnityLoader.js"></script>
		<script>
			let max = 39;
			let done = 0;
			function mergeFiles(fileParts) {
				return new Promise((resolve, reject) => {
					let buffers = [];
					function fetchPart(index) {
						if (index >= fileParts.length) {
							let mergedBlob = new Blob(buffers);
							let mergedFileUrl = URL.createObjectURL(mergedBlob);
							resolve(mergedFileUrl);
							return;
						}
						fetch(fileParts[index])
							.then((response) => response.arrayBuffer())
							.then((data) => {
								buffers.push(data);
								done++;
								document.querySelector("#loading-text").textContent = `LOADING... (${done}/${max})`;
								fetchPart(index + 1);
							})
							.catch(reject);
					}
					fetchPart(0);
				});
			}

			function getParts(file, start, end) {
				let parts = [];
				for (let i = start; i <= end; i++) parts.push(file + ".part" + i);
				return parts;
			}

			function resizeUnityContainer() {
				var container = document.getElementById("unityContainer");
				container.style.width = window.innerWidth + "px";
				container.style.height = window.innerHeight + "px";
			}

			Promise.all([
				mergeFiles(getParts("Build/FTFHAPort.data.unityweb", 1, 39)),
			]).then(([dataUrl]) => {
				window.dataUrll = dataUrl;
				var json = {
					companyName: "Rayll",
					productName: "Fears To Fathom",
					dataUrl: dataUrl,
					wasmCodeUrl: "Build/FTFHAPort.wasm.code.unityweb",
					wasmFrameworkUrl: "Build/FTFHAPort.wasm.framework.unityweb",
					TOTAL_MEMORY: 536870912,
					graphicsAPI: ["WebGL 2.0", "WebGL 1.0"],
					webglContextAttributes: { preserveDrawingBuffer: false },
					splashScreenStyle: "Dark",
					backgroundColor: "#231F20",
				};
				UnityLoader.instantiate("unityContainer", json, {
					Module: {
						onRuntimeInitialized: function () {
							resizeUnityContainer();
							document.querySelector("#loading-text").remove();
						},
					},
				});
			});
		</script>
	</head>
	<body>
		<div id="loading-text">LOADING...</div>
		<div id="unityContainer"></div>
	</body>
</html>
